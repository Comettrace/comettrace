name: dco

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: every commit carries the sign-off of its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git show --no-patch --format='%an <%ae>' "$sha")
            subject=$(git show --no-patch --format='%h %s' "$sha")
            if git show --no-patch --format='%B' "$sha" |
              grep -qiF "Signed-off-by: $author"; then
              echo "signed    $subject"
            else
              echo "::error::$subject carries no sign-off for $author"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "$missing commit(s) need a sign-off. See CONTRIBUTING.md."
            echo "The last one:      git commit -s --amend --no-edit"
            echo "All of them:       git rebase --signoff $BASE"
            exit 1
          fi
          echo "Every commit is signed off."
