name: ci

on:
  pull_request:
  push:
    branches: [main, develop]
    paths:
      - "crates/**"
      - "apps/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/ci.yaml"
      - "Dockerfile"
      - "deploy/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [fmt, clippy, test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: matrix.task != 'fmt'
        with:
          shared-key: rust-${{ matrix.task }}
          cache-on-failure: true
      - name: fmt
        if: matrix.task == 'fmt'
        run: cargo fmt --all -- --check
      - name: clippy
        if: matrix.task == 'clippy'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        if: matrix.task == 'test'
        run: |
          cargo test --workspace --locked
          cargo test --doc --workspace --locked

  ee-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-ee-gate
          cache-on-failure: true
      - name: the default build excludes the ee crate
        run: |
          if cargo tree -p comettrace -e normal --locked | grep -q comettrace-ee; then
            echo "::error::comettrace-ee is in the default dependency graph"
            exit 1
          fi
      - name: the ee feature pulls the ee crate in
        run: |
          if ! cargo tree -p comettrace -e normal --features ee --locked | grep -q comettrace-ee; then
            echo "::error::the ee feature does not pull comettrace-ee in"
            exit 1
          fi
      - name: the ee crate builds behind its feature
        run: cargo build -p comettrace --features ee --locked

  control-plane:
    runs-on: ubuntu-latest
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: comettrace
          POSTGRES_PASSWORD: comettrace
          POSTGRES_DB: comettrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U comettrace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://comettrace:comettrace@localhost:5432/comettrace
      REQUIRE_DATABASE_URL: "1"
      REDIS_URL: redis://localhost:6379
      REQUIRE_REDIS_URL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-postgres
          cache-on-failure: true
      - name: the control plane schema and the usage counter
        run: cargo test -p comettrace-storage --test control_plane --test usage_counter --test auth --test memberships --locked

  clickhouse:
    runs-on: ubuntu-latest
    needs: check
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_PASSWORD: comettrace
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CLICKHOUSE_URL: http://localhost:8123
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: comettrace
      REQUIRE_CLICKHOUSE_URL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-clickhouse
          cache-on-failure: true
      - name: migrations up, down and up again against a real server
        run: cargo test -p comettrace-storage --test clickhouse_migrations --test span_sink --locked
      - name: small versus large batches
        run: cargo run -p comettrace-storage --example batching_benchmark --release --locked

  self-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: the image builds
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: comettrace:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: how big the image is
        run: |
          set -eu
          bytes=$(docker image inspect comettrace:local --format '{{.Size}}')
          mib=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
          echo "The runtime image is **${mib} MiB** uncompressed." >> "$GITHUB_STEP_SUMMARY"
      - name: the stack comes up on a clean machine
        working-directory: deploy
        run: |
          docker compose up --detach --no-build --wait --wait-timeout 180
      - name: the server migrated the span store it was pointed at
        working-directory: deploy
        run: |
          set -eu
          exists=$(docker compose exec -T clickhouse clickhouse-client \
            --user=comettrace --password=comettrace --database=comettrace \
            --query="EXISTS TABLE spans")
          test "$exists" = "1" || { echo "the spans table is missing"; exit 1; }
          applied=$(docker compose exec -T clickhouse clickhouse-client \
            --user=comettrace --password=comettrace --database=comettrace \
            --query="SELECT max(version) FROM schema_migrations FINAL")
          shipped=$(ls ../crates/storage/migrations/clickhouse/*.up.sql | wc -l | tr -d " ")
          test "$applied" = "$shipped" ||
            { echo "the span schema is at $applied of $shipped"; exit 1; }
      - name: the server migrated its control plane
        working-directory: deploy
        run: |
          set -eu
          tables=$(docker compose exec -T postgres psql --username comettrace \
            --dbname comettrace --tuples-only --no-align \
            --command "SELECT count(*) FROM information_schema.tables \
                       WHERE table_schema = 'public' AND table_name IN \
                       ('accounts', 'orgs', 'org_members', 'api_keys', 'sessions')")
          test "$tables" = "5" || { echo "only $tables control plane tables exist"; exit 1; }
      - name: bootstrap gives the deployment a way in, once
        working-directory: deploy
        run: |
          set -eu
          docker compose exec -T server comettrace bootstrap \
            --email operator@example.com > token.txt 2> bootstrap.log
          cat bootstrap.log
          test -s token.txt || { echo "no token was printed"; exit 1; }
          grep -q '^ct_pr_' token.txt || { echo "that is not a reset token"; exit 1; }
          docker compose exec -T server comettrace bootstrap \
            --email someone.else@example.com 2>&1 | tee second.log
          grep -q "already holds an organisation" second.log \
            || { echo "bootstrap was not idempotent"; exit 1; }
      - name: the token sets a password and the password opens a session
        working-directory: deploy
        run: |
          set -eu
          token=$(grep -m1 "^ct_pr_" token.txt)
          curl --fail --silent --show-error -X POST \
            http://localhost:4318/auth/reset/confirm \
            -H 'x-requested-with: ci' -H 'content-type: application/json' \
            -d "{\"token\":\"$token\",\"password\":\"a long enough one\"}"
          curl --fail --silent --show-error -X POST \
            http://localhost:4318/auth/sign-in \
            -H 'x-requested-with: ci' -H 'content-type: application/json' \
            -d '{"email":"operator@example.com","password":"a long enough one"}' \
            --cookie-jar jar.txt
          grep -q ct_session jar.txt || { echo "no session cookie was set"; exit 1; }
      - name: a short password is refused with the rule that refused it
        working-directory: deploy
        run: |
          set -eu
          code=$(curl --silent --output body.txt --write-out '%{http_code}' -X POST \
            http://localhost:4318/auth/reset/confirm \
            -H 'x-requested-with: ci' -H 'content-type: application/json' \
            -d '{"token":"ct_pr_whatever","password":"short"}')
          test "$code" = "422" || { echo "a weak password answered $code"; exit 1; }
          grep -q "at least 12 characters" body.txt || { cat body.txt; exit 1; }
      - name: the app is served and every deep link reaches it
        working-directory: deploy
        run: |
          set -eu
          curl --fail --silent --show-error http://localhost:4318/ > root.html
          grep -qi "<!doctype html" root.html || { head -c 200 root.html; exit 1; }
          for deep in /traces /traces/abc123 /reset?token=ct_pr_abc; do
            code=$(curl --silent --output /dev/null --write-out "%{http_code}" "http://localhost:4318$deep")
            test "$code" = "200" || { echo "$deep answered $code"; exit 1; }
          done
      - name: the session carries the organisation it owns
        working-directory: deploy
        run: |
          set -eu
          curl --fail --silent --show-error http://localhost:4318/auth/me \
            -H 'x-requested-with: ci' --cookie jar.txt > me.json
          cat me.json
          grep -q "\"role\":\"owner\"" me.json || { echo "the owner lost its role"; exit 1; }
          grep -q "operator@example.com" me.json || { echo "no address to show"; exit 1; }
          grep -q "\"name\":\"Default\"" me.json || { echo "no org name to show"; exit 1; }
      - name: an issued key authenticates a payload and an unissued one does not
        working-directory: deploy
        run: |
          set -eu
          org=$(docker compose exec -T postgres psql --username comettrace \
            --dbname comettrace --tuples-only --no-align \
            --command "SELECT id FROM orgs LIMIT 1" | tr -d '[:space:]')
          key=$(docker compose exec -T server comettrace issue-key --org "$org" 2>/dev/null \
            | grep -m1 "^ct_" | tr -d "[:space:]")
          accepted=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            http://localhost:4318/v1/traces -H "authorization: Bearer $key" \
            -H 'content-type: application/x-protobuf' --data-binary '')
          test "$accepted" = "200" || { echo "an issued key answered $accepted"; exit 1; }
          refused=$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            http://localhost:4318/v1/traces -H "authorization: Bearer ct_live_nonsense.nonsense" \
            -H 'content-type: application/x-protobuf' --data-binary '')
          test "$refused" = "401" || { echo "an unissued key answered $refused"; exit 1; }
      - name: what the server said
        if: always()
        working-directory: deploy
        run: docker compose logs server
      - name: stop
        if: always()
        working-directory: deploy
        run: docker compose down --volumes

  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/arm64
            features: ""
          - platform: linux/amd64
            features: "ee"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: the image builds for ${{ matrix.platform }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            FEATURES=${{ matrix.features }}
          push: false
          cache-from: type=gha,scope=cross-${{ matrix.platform }}-${{ matrix.features }}
          cache-to: type=gha,mode=max,scope=cross-${{ matrix.platform }}-${{ matrix.features }}
