name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/ferrislabs/ferristrace

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: the tag matches the version the workspace declares
        run: |
          set -eu
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(grep -m1 '^version = ' Cargo.toml | sed 's/version = "//; s/"$//')
          test "${tagged%-rc.*}" = "$declared" || {
            echo "::error::the tag says ${tagged%-rc.*} and Cargo.toml says $declared"
            echo "Bump the workspace version in its own commit before tagging."
            exit 1
          }
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: rust-release
          cache-on-failure: true
      - name: the tag is formatted, lint-clean and green
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          cargo test --doc --workspace --locked

  images:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: community
            features: ""
            suffix: ""
          - variant: cloud
            features: "ee"
            suffix: "-ee"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: what is being released
        id: release
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-rc.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: the tags this variant carries
        id: tags
        run: |
          set -eu
          version="${{ steps.release.outputs.version }}"
          suffix="${{ matrix.suffix }}"
          tags="${IMAGE}:${version}${suffix}"
          if [ "${{ matrix.variant }}" = "community" ] \
            && [ "${{ steps.release.outputs.prerelease }}" = "false" ]; then
            tags="$tags,${IMAGE}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push for both architectures
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            FEATURES=${{ matrix.features }}
          tags: ${{ steps.tags.outputs.tags }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.variant }}
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: the changelog of this tag, from its commits
        id: cliff
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          config: cliff.toml
          args: --latest --strip header
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: measure what was published
        id: sizes
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          {
            echo "| Image | Platform | Compressed |"
            echo "| --- | --- | --- |"
          } > sizes.md
          for suffix in "" "-ee"; do
            tag="${version}${suffix}"
            docker buildx imagetools inspect "${IMAGE}:${tag}" --raw \
              | jq -r '.manifests[]? | select(.platform.os == "linux")
                       | select(.platform.architecture != "unknown")
                       | "\(.platform.architecture) \(.digest)"' \
              | while read -r arch digest; do
                  bytes=$(docker buildx imagetools inspect "${IMAGE}@${digest}" --raw \
                    | jq '[.layers[].size] | add')
                  mib=$(awk -v b="$bytes" 'BEGIN { printf "%.1f", b / 1048576 }')
                  echo "| \`${IMAGE}:${tag}\` | linux/${arch} | ${mib} MiB |" >> sizes.md
                done
          done
          cat sizes.md >> "$GITHUB_STEP_SUMMARY"
      - name: cut the release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          {
            echo "## Images"
            echo
            echo '```sh'
            echo "docker pull ${IMAGE}:${version}"
            echo '```'
            echo
            echo "The \`-ee\` tag carries the cloud build. Both are"
            echo "linux/amd64 and linux/arm64 with provenance attached."
            echo
            cat sizes.md
          } > body.md
          echo >> body.md
          printf '%s\n' "$NOTES" >> body.md
          prerelease=""
          case "$version" in *-rc.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file body.md \
            $prerelease
