name: comettrace

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: comettrace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comettrace}
      POSTGRES_DB: comettrace
    volumes:
      - postgres:/var/lib/postgresql/data
    # Bound to the loopback so a database whose password defaults to `comettrace` answers this
    # machine and nothing else. Widening POSTGRES_BIND puts it on the network: set a password first.
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username comettrace --dbname comettrace"]
      interval: 5s
      timeout: 5s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: comettrace
      CLICKHOUSE_USER: comettrace
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-comettrace}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse:/var/lib/clickhouse
    healthcheck:
      test:
        - CMD
        - clickhouse-client
        - --user=comettrace
        - --password=${CLICKHOUSE_PASSWORD:-comettrace}
        - --query=SELECT 1
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${COMETTRACE_IMAGE:-comettrace:local}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      COMETTRACE_DATABASE_URL: postgres://comettrace:${POSTGRES_PASSWORD:-comettrace}@postgres:5432/comettrace
      COMETTRACE_REDIS_URL: redis://redis:6379
      COMETTRACE_SPANS__URL: http://clickhouse:8123
      COMETTRACE_SPANS__DATABASE: comettrace
      COMETTRACE_SPANS__USER: comettrace
      COMETTRACE_SPANS__PASSWORD: ${CLICKHOUSE_PASSWORD:-comettrace}
      COMETTRACE_SPANS__RETENTION_DAYS: ${RETENTION_DAYS:-30}
      COMETTRACE_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "comettrace", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres:
  clickhouse:
  redis:
