[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/otlp",
    "crates/storage",
    "crates/api",
    "crates/ee",
    "apps/server",
]
default-members = [
    "crates/core",
    "crates/otlp",
    "crates/storage",
    "crates/api",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
comettrace-core = { path = "crates/core" }
comettrace-otlp = { path = "crates/otlp" }
comettrace-storage = { path = "crates/storage" }
comettrace-api = { path = "crates/api" }
comettrace-ee = { path = "crates/ee" }

anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
clickhouse = { version = "0.15.3", features = ["uuid", "inserter"] }
figment = { version = "0.10.19", features = ["env", "toml"] }
flate2 = "1.1.6"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "trace"] }
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_repr = "0.1.20"
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio-stream = "0.1.17"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tonic = { version = "0.14.3", features = ["gzip"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["decompression-gzip", "limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
return_self_not_must_use = "allow"
duration_suboptimal_units = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
