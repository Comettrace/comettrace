[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/otlp",
    "crates/storage",
    "crates/api",
    "crates/ee",
    "apps/server",
]
default-members = [
    "crates/core",
    "crates/otlp",
    "crates/storage",
    "crates/api",
    "apps/server",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
comettrace-core = { path = "crates/core" }
comettrace-otlp = { path = "crates/otlp" }
comettrace-storage = { path = "crates/storage" }
comettrace-api = { path = "crates/api" }
comettrace-ee = { path = "crates/ee" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_precision_loss = "allow"
return_self_not_must_use = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
